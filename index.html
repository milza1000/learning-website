<!DOCTYPE html>
<!-- ============================================================
     index.html : ไฟล์หน้าเว็บหลัก (เลือกวิชา)
     ============================================================ -->
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>ห้องเรียนทบทวนออนไลน์</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <header class="site-header">
    <h1>ห้องเรียนทบทวนออนไลน์</h1>
    <p>เลือกวิชาที่ต้องการ • เรียนเนื้อหา ทำแบบฝึกหัด พร้อมพื้นที่คิดเลขและวาดรูปในตัว</p>
  </header>

  <!-- สวิตช์โหมดมืด/สว่าง -->
  <label class="theme-switch" title="สลับโหมดมืด/สว่าง">
    <input type="checkbox" id="theme-toggle" aria-label="สลับโหมดมืด/สว่าง" />
    <span class="switch-track">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
      </svg>
      <span class="switch-knob"></span>
    </span>
  </label>

  <main>
    <section id="home-section" class="page active">
      <div class="home-hero">
        <h2>เลือกวิชาที่ต้องการทบทวน</h2>
        <p>เรียนเนื้อหา ทำแบบฝึกหัดตรวจทันที พร้อมพื้นที่คิดเลขและวาดรูปในตัว</p>
      </div>
      <div id="subject-grid" class="subject-grid">
        <!-- script.js เติมการ์ดวิชาตรงนี้ -->
      </div>
    </section>
  </main>

  <footer class="site-footer">
    ห้องเรียนทบทวนออนไลน์ • สร้างด้วย HTML + CSS + JavaScript
  </footer>

  <script src="script.js"></script>
</body>
</html>
